main::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,20,51,.95) 0%,rgba(0,20,51,.75) 50%,rgba(0,20,51,.35) 100%)}
main .wrap{position:relative;padding-top:64px;padding-bottom:96px}
.check{width:64px;height:64px;display:grid;place-items:center;background:var(--yellow);color:var(--navy)}
.check svg{width:32px;height:32px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin-top:36px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor}
h1{margin:18px 0 0;font-size:clamp(48px,7vw,96px);font-weight:700;line-height:1;letter-spacing:-.03em}
p{margin:24px 0 0;max-width:560px;font-size:clamp(18px,1.6vw,22px);color:var(--on-dark-muted)}
p a{color:#fff}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;font:600 16px/1 var(--font);text-decoration:none;border:2px solid transparent;transition:background .2s,border-color .2s}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--yellow);color:var(--navy)}
.btn-primary:hover{background:#fff}
.btn-ghost{border-color:rgba(255,255,255,.55)}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}
footer{border-top:1px solid var(--on-dark-line);font-size:14px;color:var(--on-dark-muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:24px;padding-bottom:24px}
footer a{text-decoration:none}
footer a:hover{color:#fff}
